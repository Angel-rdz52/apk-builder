name: Build APK from ZIP
on:
  push:
    paths:
      - 'project.zip'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Unzip project
        run: |
          rm -rf build-src
          mkdir build-src
          unzip -o project.zip -d build-src

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          GRADLE=$(find build-src -name gradlew -type f | head -n1)
          chmod +x $GRADLE
          DIR=$(dirname $GRADLE)
          cd $DIR
          ./gradlew assembleDebug

      - name: Upload APK to Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          files: build-src/**/app/build/outputs/apk/debug/*.apk
          token: ${{ secrets.GITHUB_TOKEN }}
